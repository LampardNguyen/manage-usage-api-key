# Thêm vào <VirtualHost *:443> của your-domain.example
# Cần bật module: sudo a2enmod proxy proxy_http headers  (rồi reload Apache)
#
# Giữ nguyên tiền tố /openai-custom khi chuyển tiếp — app tự xử lý BASE_PATH=/openai-custom.

<Location "/openai-custom/">
    ProxyPass        "http://127.0.0.1:3005/openai-custom/"
    ProxyPassReverse "http://127.0.0.1:3005/openai-custom/"
    # Chờ OpenAI trả lời (giây) — nên >= UPSTREAM_TIMEOUT_SEC trong .env
    ProxyTimeout 150
    RequestHeader set X-Forwarded-Proto "https"
</Location>

# Để /openai-custom (không có dấu / cuối) cũng vào được
RedirectMatch 301 "^/openai-custom$" "/openai-custom/admin/"

# (Tuỳ chọn) chỉ cho một số IP vào trang quản trị — bỏ comment và sửa IP:
# <Location "/openai-custom/admin/">
#     Require ip 203.0.113.10 198.51.100.0/24
# </Location>
